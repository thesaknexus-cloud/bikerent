databases:
  - name: bikemate-db
    databaseName: bikemate
    user: bikemate
    plan: free
services:
  - type: web
    name: bikemate-api
    runtime: docker
    rootDir: Bike_Back
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/bikes
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_URL
        fromDatabase:
          name: bikemate-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: bikemate-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bikemate-db
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DDL_AUTO
        value: update
      - key: H2_CONSOLE_ENABLED
        value: "false"
