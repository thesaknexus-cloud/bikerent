spring.application.name=BikeMate
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/bikemate;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
campusride.jwt.secret=${JWT_SECRET:CampusRide-development-secret-key-change-me-please-32chars}
campusride.jwt.expiration=${JWT_EXPIRATION:86400000}
campusride.cors-origin=${CORS_ORIGIN:http://localhost:5173}
campusride.fine-rate-paise-per-minute=${FINE_RATE_PAISE_PER_MINUTE:250}
